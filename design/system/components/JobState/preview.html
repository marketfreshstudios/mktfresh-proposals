<!-- @dsCard group="Status" height=264 subtitle="Background work, always visible beside the proposal and retryable in place" -->
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em;
         text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius-md); padding: 16px; }
</style>
<div id="root"></div>
<script>
(function () {
  var D = window.ProposalDS, h = React.createElement;
  var { JobState } = D;
  function App() {
    return h('div', {className:'card', style:{display:'flex', flexDirection:'column', gap:'16px'}},
      h(JobState, {state:'queued', label:'Seal countersigned PDF'}),
      h(JobState, {state:'running', label:'Send final copy to r.vale@brightline.example'}),
      h(JobState, {state:'failed', label:'Create draft invoice', attempts:3,
        error:'The accounting provider rejected the item mapping for \u201cDiscovery workshop\u201d.',
        onRetry:function(){}}),
      h(JobState, {state:'review', label:'Match customer record', attempts:1,
        error:'Two customers match \u201cBrightline Foods\u201d. Pick one or create a new record.',
        onRetry:function(){}}));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
