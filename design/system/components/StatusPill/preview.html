<!-- @dsCard group="Status" height=224 subtitle="Fixed vocabulary — icon and word together, never a bare dot" -->
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em;
         text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius-md); padding: 16px; }
</style>
<div id="root"></div>
<script>
(function () {
  var D = window.ProposalDS, h = React.createElement;
  var { StatusPill } = D;
  function App() {
    return h('div', {className:'col'},
      h('div', null,
        h('p', {className:'cap'}, 'Lifecycle'),
        h('div', {className:'row', style:{gap:'8px'}},
          ['draft','sent','viewed','signed','completed','declined','expired','archived'].map(function(s) {
            return h(StatusPill, {key:s, status:s});
          }))),
      h('div', null,
        h('p', {className:'cap'}, 'Signed by client is warning, not success \u2014 it is waiting on you'),
        h('div', {className:'row', style:{gap:'8px'}},
          h(StatusPill, {status:'signed'}),
          h(StatusPill, {status:'completed'}))),
      h('div', null,
        h('p', {className:'cap'}, 'Orthogonal marks'),
        h('div', {className:'row', style:{gap:'8px'}},
          h(StatusPill, {status:'aiDraft', title:'Drafted by Claude \u00b7 2 hours ago'}),
          h(StatusPill, {status:'completed', source:'imported'}))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
