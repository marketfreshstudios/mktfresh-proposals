<!-- @dsCard group="Foundations" height=252 subtitle="Free-text labels — what StatusPill and JobState deliberately cannot carry" -->
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em;
         text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius-md); padding: 16px; }
</style>
<div id="root"></div>
<script>
(function () {
  var D = window.ProposalDS, h = React.createElement;
  var { Badge } = D;
  function App() {
    return h('div', {className:'col'},
      h('div', null,
        h('p', {className:'cap'}, 'Tones'),
        h('div', {className:'row', style:{gap:'8px'}},
          h(Badge, {tone:'success', icon:'verified'}, 'Connected'),
          h(Badge, {tone:'warning', icon:'clock'}, 'Waiting'),
          h(Badge, {tone:'danger', icon:'failed'}, 'Invoice sync failed \u00b7 attempt 3'),
          h(Badge, {tone:'info', icon:'send'}, 'Reminder scheduled'),
          h(Badge, {tone:'ai', icon:'ai'}, 'Claude'),
          h(Badge, {tone:'neutral'}, 'Custom line'))),
      h('div', null,
        h('p', {className:'cap'}, 'Outline \u2014 for a provenance mark, never a state'),
        h('div', {className:'row', style:{gap:'8px'}},
          h(Badge, {variant:'outline'}, 'Proposify import'),
          h(Badge, {variant:'outline'}, 'Template: Website project'))),
      h('div', {className:'card'},
        h('p', {style:{margin:0, fontSize:'13px', lineHeight:'20px', color:'var(--ink-muted)'}},
          'Badge carries free text. A proposal\u2019s lifecycle status is ',
          h('strong', {style:{color:'var(--ink)'}}, 'StatusPill'),
          ' and background work is ',
          h('strong', {style:{color:'var(--ink)'}}, 'JobState'),
          ' \u2014 both have fixed vocabularies on purpose. Reaching for Badge to say \u201cSigned\u201d is the mistake this component exists to prevent.')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
