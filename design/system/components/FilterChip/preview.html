<!-- @dsCard group="Data" height=196 subtitle="Filters that show their current value without opening anything" -->
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em;
         text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius-md); padding: 16px; }
</style>
<div id="root"></div>
<script>
(function () {
  var D = window.ProposalDS, h = React.createElement;
  var { FilterChip, Button } = D;
  function App() {
    return h('div', {className:'col'},
      h('div', null,
        h('p', {className:'cap'}, 'Above the proposals table'),
        h('div', {className:'row', style:{gap:'8px'}},
          h(FilterChip, {label:'Status', value:'Signed by client, Viewed', active:true,
            onClick:function(){}, onClear:function(){}}),
          h(FilterChip, {label:'Client', value:'any', onClick:function(){}}),
          h(FilterChip, {label:'Sent', value:'last 90 days', active:true,
            onClick:function(){}, onClear:function(){}}),
          h(FilterChip, {label:'Source', value:'any', onClick:function(){}}),
          h(Button, {variant:'ghost', size:'sm'}, 'Clear filters'))),
      h('div', {className:'card'},
        h('p', {style:{margin:0, fontSize:'13px', lineHeight:'20px', color:'var(--ink-muted)'}},
          'An active filter set must be readable without opening a panel. ',
          '\u201cWhere did my proposal go?\u201d is the most common confusion in a list like this, and a ',
          'hidden filter drawer causes it.')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
