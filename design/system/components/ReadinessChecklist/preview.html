<!-- @dsCard group="Feedback" height=440 subtitle="Mirrors the server's send validation; any failure blocks the send" -->
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em;
         text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius-md); padding: 16px; }
</style>
<div id="root"></div>
<script>
(function () {
  var D = window.ProposalDS, h = React.createElement;
  var { ReadinessChecklist, Button } = D;
  function App() {
    return h('div', {className:'card', style:{maxWidth:'620px'}},
      h('p', {className:'cap'}, 'Ready to send'),
      h(ReadinessChecklist, {items:[
        {state:'fail', label:'Two variables are unresolved',
         detail:'{{client.company}} and {{quote.valid_until}} have no value.',
         action:h(Button, {size:'sm', variant:'ghost'}, 'Show me')},
        {state:'pass', label:'Both signature blocks are present',
         detail:'Client signs first, then you counter-sign.'},
        {state:'fail', label:'One selected line has no billing mapping',
         detail:'\u201cPhotography day\u201d is a custom line with no accounting item set.',
         action:h(Button, {size:'sm', variant:'ghost'}, 'Set mapping')},
        {state:'warn', label:'This draft has unreviewed AI changes',
         detail:'Claude edited it 2 hours ago. You can send anyway once you confirm.'},
        {state:'pass', label:'Recipient email is set',
         detail:'r.vale@brightline.example \u2014 the client must sign with this exact address.'}]}));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
