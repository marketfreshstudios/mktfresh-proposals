<!-- @dsCard group="Editor" height=212 subtitle="Resolved, unresolved and raw — an unresolved variable blocks sending" -->
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em;
         text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius-md); padding: 16px; }
</style>
<div id="root"></div>
<script>
(function () {
  var D = window.ProposalDS, h = React.createElement;
  var { VariableChip } = D;
  function App() {
    return h('div', {className:'card', style:{maxWidth:'620px'}},
      h('p', {className:'cap'}, 'In the editor canvas'),
      h('p', {style:{font:'400 17px/28px var(--font-serif)', margin:'0 0 20px'}},
        'Prepared for ', h(VariableChip, {name:'client.first_name', value:'Rowan', showValue:true}),
        ' at ', h(VariableChip, {name:'client.company', resolved:false}),
        '. The one-time total is ',
        h(VariableChip, {name:'quote.one_time_total', value:'$12,400.00', showValue:true}),
        ' and the monthly total is ',
        h(VariableChip, {name:'quote.monthly_total', value:'$175.00', showValue:true}), '.'),
      h('p', {className:'cap'}, 'In the variable picker'),
      h('div', {className:'row', style:{gap:'8px'}},
        h(VariableChip, {name:'client.first_name', value:'Rowan'}),
        h(VariableChip, {name:'quote.one_time_total', value:'$12,400.00'}),
        h(VariableChip, {name:'client.company', resolved:false})));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
